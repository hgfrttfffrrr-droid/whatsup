
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

// Configure Android modules
subprojects { subproject ->

    subproject.plugins.withId("com.android.library") {
        def androidExtension =
            subproject.extensions.findByName("android")

        if (androidExtension != null) {
            androidExtension.buildFeatures.buildConfig = true

            androidExtension.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            if (androidExtension.namespace == null) {
                def manifestFile = subproject.file(
                    "src/main/AndroidManifest.xml"
                )

                def namespaceValue = null

                if (manifestFile.exists()) {
                    def matcher = manifestFile.getText("UTF-8") =~ /package=["']([^"']+)["']/

                    if (matcher.find()) {
                        namespaceValue = matcher.group(1)
                    }
                }

                if (namespaceValue == null) {
                    namespaceValue = "com.flutter.plugins." +
                        subproject.name.replaceAll("[^A-Za-z0-9]", "")
                }

                androidExtension.namespace = namespaceValue
            }
        }
    }

    subproject.plugins.withId("com.android.application") {
        def androidExtension =
            subproject.extensions.findByName("android")

        if (androidExtension != null) {
            androidExtension.buildFeatures.buildConfig = true

            androidExtension.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
