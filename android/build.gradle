
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

// Enable BuildConfig for Android modules
subprojects {
    plugins.withId("com.android.library") {
        android {
            buildFeatures {
                buildConfig = true
            }
        }
    }

    plugins.withId("com.android.application") {
        android {
            buildFeatures {
                buildConfig = true
            }
        }
    }
}

// Automatically set missing Android namespaces
subprojects {
    afterEvaluate { project ->

        if (project.plugins.hasPlugin("com.android.library") ||
            project.plugins.hasPlugin("com.android.application")) {

            def androidExtension = project.extensions.findByName("android")

            if (androidExtension != null &&
                androidExtension.namespace == null) {

                def manifestFile = project.file(
                    "src/main/AndroidManifest.xml"
                )

                if (manifestFile.exists()) {

                    def matcher = manifestFile.getText("UTF-8") =~ /package=["']([^"']+)["']/

                    if (matcher.find()) {
                        androidExtension.namespace = matcher.group(1)
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
