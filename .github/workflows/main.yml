name: Build WhatsUp APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.3'
        channel: 'stable'

    - name: Get Dependencies
      run: flutter pub get

    # ساخت فایل موقت فایربیس
    - name: Create Dummy Firebase Options
      run: |
        mkdir -p lib
        touch lib/firebase_options.dart
        echo "// Dummy file to bypass build error" > lib/firebase_options.dart

    # بازنویسی کامل فایل build.gradle اندروید (سطح بالا)
    - name: Fix Android build.gradle entirely
      run: |
        cat << 'EOF' > android/build.gradle
        buildscript {
            ext.kotlin_version = '1.9.22'
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
                classpath 'com.google.gms:google-services:4.4.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.buildDir = '../build'
        subprojects {
            project.buildDir = "${rootProject.buildDir}/${project.name}"
        }
        subprojects {
            project.evaluationDependsOn(':app')
        }
        tasks.register("clean", Delete) {
            delete rootProject.buildDir
        }
        EOF

    # مرحله جدید: فعال‌سازی BuildConfig در فایل app/build.gradle
    - name: Enable BuildConfig Feature
      run: |
        # اضافه کردن buildFeatures { buildConfig true } به بلوک android در app/build.gradle
        sed -i '/android {/a \    buildFeatures {\n        buildConfig true\n    }' android/app/build.gradle

    - name: Build APK
      run: flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WhatsUp-Debug-APK
        path: build/app/outputs/flutter-apk/app-debug.apk
