name: Build WhatsUp APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.3' # نسخه‌ای که توی README گفته شده
        channel: 'stable'

    - name: Get Dependencies
      run: flutter pub get

    # چون فایل firebase_options.dart نداریم، یک فایل خالی موقت میسازیم تا بیلد رد بشه
    - name: Create Dummy Firebase Options
      run: |
        mkdir -p lib
        touch lib/firebase_options.dart
        echo "// Dummy file to bypass build error" > lib/firebase_options.dart

    - name: Build APK
      run: flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WhatsUp-Debug-APK
        path: build/app/outputs/flutter-apk/app-debug.apk
