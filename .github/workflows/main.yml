name: Build WhatsUp APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.3'
        channel: 'stable'

    # ساخت فایل .env خالی
    - name: Create Dummy .env file
      run: |
        touch .env
        echo "API_URL=http://localhost" > .env
        echo "FIREBASE_API_KEY=dummy" >> .env

    # حذف پکیج win32
    - name: Remove win32 dependency override
      run: |
        sed -i '/win32:/d' pubspec.yaml
        sed -i '/dependency_overrides:/d' pubspec.yaml

    - name: Get Dependencies
      run: flutter pub get

    # ساخت فایل موقت فایربیس
    - name: Create Dummy Firebase Options
      run: |
        mkdir -p lib
        touch lib/firebase_options.dart
        echo "// Dummy file to bypass build error" > lib/firebase_options.dart

    # پاک کردن تگ package از تمام AndroidManifest.xml ها
    - name: Remove package attribute from ALL third-party manifests
      run: |
        find ~/.pub-cache/hosted/pub.dev/ -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} \;

    # تزریق تنظیمات به همه پکیج‌ها (اضافه کردن jvmTarget)
    - name: Inject Global Gradle Fixes
      run: |
        mkdir -p ~/.gradle/init.d
        cat << 'EOF' > ~/.gradle/init.d/global-fixes.gradle
        allprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    if (project.android.hasProperty('buildFeatures')) {
                        project.android.buildFeatures.buildConfig = true
                    }
                    if (project.android.namespace == null) {
                        if (project.name != 'app') {
                            project.android.namespace = "com.example.${project.name.replace('-', '_')}"
                        }
                    }
                    // حل مشکل نسخه جاوا در پکیج‌های جانبی
                    project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                        kotlinOptions {
                            jvmTarget = "17"
                        }
                    }
                    project.tasks.withType(JavaCompile).configureEach {
                        sourceCompatibility = JavaVersion.VERSION_17
                        targetCompatibility = JavaVersion.VERSION_17
                    }
                }
            }
        }
        EOF

    # بازنویسی فایل build.gradle سطح بالا
    - name: Fix Android build.gradle entirely
      run: |
        cat << 'EOF' > android/build.gradle
        buildscript {
            ext.kotlin_version = '1.9.22'
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
                classpath 'com.google.gms:google-services:4.4.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.buildDir = '../build'
        subprojects {
            project.buildDir = "${rootProject.buildDir}/${project.name}"
        }
        subprojects {
            project.evaluationDependsOn(':app')
        }
        tasks.register("clean", Delete) {
            delete rootProject.buildDir
        }
        EOF

    - name: Build APK
      run: flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WhatsUp-Debug-APK
        path: build/app/outputs/flutter-apk/app-debug.apk
