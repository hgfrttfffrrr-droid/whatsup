name: Build WhatsUp APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.3'
        channel: 'stable'

    # ساخت فایل .env خالی
    - name: Create Dummy .env file
      run: |
        touch .env
        echo "API_URL=http://localhost" > .env
        echo "FIREBASE_API_KEY=dummy" >> .env

    # حذف پکیج win32
    - name: Remove win32 dependency override
      run: |
        sed -i '/win32:/d' pubspec.yaml
        sed -i '/dependency_overrides:/d' pubspec.yaml

    - name: Get Dependencies
      run: flutter pub get

    # ساخت فایل موقت فایربیس
    - name: Create Dummy Firebase Options
      run: |
        mkdir -p lib
        touch lib/firebase_options.dart
        echo "// Dummy file to bypass build error" > lib/firebase_options.dart

    # پاک کردن تگ package از تمام AndroidManifest.xml ها
    - name: Remove package attribute from ALL third-party manifests
      run: |
        find ~/.pub-cache/hosted/pub.dev/ -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} \;

    # تنظیم نسخه جاوا در فایل gradle.properties (روش استاندارد)
    - name: Set Java version in gradle.properties
      run: |
        echo "org.gradle.java.home=/opt/hostedtoolcache/Java_Zulu_jdk/17.0.9-9/x64" >> android/gradle.properties
        echo "android.useAndroidX=true" >> android/gradle.properties
        echo "android.enableJetifier=true" >> android/gradle.properties

    # بازنویسی فایل build.gradle سطح بالا
    - name: Fix Android build.gradle entirely
      run: |
        cat << 'EOF' > android/build.gradle
        buildscript {
            ext.kotlin_version = '1.9.22'
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
                classpath 'com.google.gms:google-services:4.4.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.buildDir = '../build'
        subprojects {
            project.buildDir = "${rootProject.buildDir}/${project.name}"
        }
        subprojects {
            project.evaluationDependsOn(':app')
        }
        tasks.register("clean", Delete) {
            delete rootProject.buildDir
        }
        EOF

    # بازنویسی فایل build.gradle ماژول app برای اطمینان از تنظیمات درست
    - name: Fix app/build.gradle entirely
      run: |
        cat << 'EOF' > android/app/build.gradle
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withReader('UTF-8') { reader ->
                localProperties.load(reader)
            }
        }

        def flutterRoot = localProperties.getProperty('flutter.sdk')
        if (flutterRoot == null) {
            throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
        }

        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'
        apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
        apply plugin: 'com.google.gms.google-services'

        android {
            namespace "com.example.whatsup"
            compileSdk 34

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }

            sourceSets {
                main.java.srcDirs += 'src/main/kotlin'
            }

            defaultConfig {
                applicationId "com.example.whatsup"
                minSdkVersion 21
                targetSdkVersion 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                }
            }

            buildFeatures {
                buildConfig true
            }
        }

        flutter {
            source '../..'
        }

        dependencies {
            implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
        }
        EOF

    - name: Build APK
      run: flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WhatsUp-Debug-APK
        path: build/app/outputs/flutter-apk/app-debug.apk
